name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm test
      # ⚑ Pinned. An unpinned gate is a gate somebody else can change.
      - name: witness — try to break divorce.mjs, then READ the verdict (must be CLEAN)
        run: |
          git clone --depth 1 --branch v0.6 https://github.com/sjgant80-hub/witness.git /tmp/witness
          node /tmp/witness/witness.mjs mutate divorce.mjs             --timeout 60000 --cap 500 --baseline witness.baseline.json             --test node --test divorce.test.mjs | tee verdict.txt
          grep -q '"clean": true' verdict.txt || { echo "::error::mutants survived — the gate is not clean"; exit 1; }
      # ⚑ Pinned. An unpinned gate is a gate somebody else can change.
      - name: witness — try to break ingest.mjs, then READ the verdict (must be CLEAN)
        run: |
          node /tmp/witness/witness.mjs mutate ingest.mjs             --timeout 60000 --cap 500 --baseline witness.baseline.json             --test node --test ingest.test.mjs | tee verdict.txt
          grep -q '"clean": true' verdict.txt || { echo "::error::mutants survived — the gate is not clean"; exit 1; }
      # ⚑ Pinned. An unpinned gate is a gate somebody else can change.
      - name: witness — try to break precedents.mjs, then READ the verdict (must be CLEAN)
        run: |
          node /tmp/witness/witness.mjs mutate precedents.mjs             --timeout 60000 --cap 500 --baseline witness.baseline.json             --test node --test precedents.test.mjs | tee verdict.txt
          grep -q '"clean": true' verdict.txt || { echo "::error::mutants survived — the gate is not clean"; exit 1; }
